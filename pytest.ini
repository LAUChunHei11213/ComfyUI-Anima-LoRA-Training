[pytest]
# Make the pack root pytest's rootdir + on sys.path so test files can
# `from utils.config_generator import ...` / `from nodes.training_wizard
# import ...` directly. Without `pythonpath`, pytest would try to
# import the package's own __init__.py to resolve the tests subpackage,
# which fails because the __init__.py uses relative imports that need
# ComfyUI's loading context to work.
pythonpath = .
testpaths = tests
addopts = -v --tb=short
